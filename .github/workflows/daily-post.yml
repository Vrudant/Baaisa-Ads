name: Daily Instagram post

on:
  schedule:
    - cron: "30 3 * * *"   # 03:30 UTC = 9:00 AM India time
  workflow_dispatch:        # lets you run it by hand from the GitHub app

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post today's ad
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python post_ad.py
      - name: Save posted status
        run: |
          git config user.name "baaisa-bot"
          git config user.email "bot@users.noreply.github.com"
          git add queue/schedule.json
          git diff --cached --quiet || (git commit -m "Mark ad as posted" && git push)
